# Minimal SearXNG config for Recon. The critical line is `formats: [html, json]`
# under `search:` — without `json`, Recon's discovery layer gets HTML it can't parse.
# Replace the secret_key before any non-local use.
use_default_settings: true

server:
  secret_key: "dummy_change_me_before_non_local_use"   # dummy_-prefixed per Bridge no-silent-fixtures rule
  limiter: false
  image_proxy: false

search:
  safe_search: 0
  autocomplete: ""
  formats:
    - html
    - json

# Keep the engine set lean and reliable for OSINT name/company lookups.
engines:
  - name: google
    disabled: false
  - name: duckduckgo
    disabled: false
  - name: bing
    disabled: false
