name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  platform:
    name: platform (typecheck + test + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platform
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.3
      - uses: actions/setup-node@v4
        with:
          node-version-file: platform/.nvmrc
          cache: pnpm
          cache-dependency-path: platform/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      # ONE gate list, defined once in platform/package.json as `verify`, called by
      # both CI and humans. Previously CI listed `check:agent-context` and
      # `check:vocabulary` as extra steps here while local verification ran only
      # `turbo run ...` — so a root-script gate was invisible to `turbo`, and main
      # sat red for six consecutive runs while every local check was green
      # (BUGS.md OPEN 2026-08-03). Adding a gate to `verify` now necessarily adds it
      # to CI, and there is no second list to forget.
      #
      # --force is CI-only: never trust turbo's remote/local cache here — a green run
      # must mean THIS checkout was tested, not a replayed log from an unrelated
      # branch/worktree (known-issues.md 2026-07-03). Locally the cache is a feature,
      # which is the one deliberate difference between the two invocations.
      #
      # `verify` runs test:coverage, not test: the per-package coverage floors are the
      # gate and live only in that script. `test` is the coverage-free fast variant for
      # local iteration (coverage roughly doubles per-test time — nodejs/node#55103).
      - run: pnpm verify
        env:
          TURBO_FORCE: "true"
      # AP-182: the retired-vocabulary scan is ADVISORY. As a blocking first step of
      # `verify` it went red six runs in a row from 2026-07-31 and, because the
      # migrate job needs this one, pending migrations stopped applying to the
      # hosted DB while code kept deploying. A lint must never cause schema drift.
      - name: Vocabulary scan (advisory, never blocks)
        run: pnpm check:vocabulary
        continue-on-error: true

  supabase-migrate:
    name: Supabase migrate (apply pending migrations to the hosted project)
    # Only real pushes to main touch the hosted database — never a PR branch.
    # Gated on `platform` passing first: a red typecheck/test/build run must
    # not get its schema change applied to production.
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: platform
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platform
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.3
      - uses: actions/setup-node@v4
        with:
          node-version-file: platform/.nvmrc
          cache: pnpm
          cache-dependency-path: platform/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      # drizzle-kit migrate reads MIGRATION_DATABASE_URL (owner/session-pooler
      # credential) — see platform/apps/api/.env.example. Never the least-
      # privilege bridge_app DATABASE_URL the API container runs with.
      - name: Apply pending migrations
        working-directory: platform/packages/db
        env:
          MIGRATION_DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}
        run: pnpm migrate

  security-audit:
    name: security audit (no HIGH+ vulnerable deps)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platform
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.3
      - uses: actions/setup-node@v4
        with:
          node-version-file: platform/.nvmrc
          cache: pnpm
          cache-dependency-path: platform/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      # SEC-3 gate: fail the build on any HIGH/CRITICAL advisory in production deps.
      # --prod ignores devDependencies (build-only tooling); raise the bar to `moderate`
      # once the current moderate advisories are triaged. Runs as its own job so a
      # vulnerable dependency is an unambiguous, standalone red check.
      - run: pnpm audit --prod --audit-level=high

  api-container:
    name: API container (build + non-root smoke)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build production image
        run: docker build --file platform/Dockerfile --tag bridge-api:ci platform
      - name: Production configuration fails closed
        run: |
          if docker run --rm bridge-api:ci > /tmp/bridge-production-boot.log 2>&1; then
            echo "Container unexpectedly started without production configuration"
            exit 1
          fi
          grep -q "incomplete or unsafe production configuration" /tmp/bridge-production-boot.log
      - name: Probe liveness and readiness as non-root
        run: |
          vault_key="$(printf '0123456789abcdef0123456789abcdef' | base64 -w0)"
          docker run --detach --name bridge-api-ci \
            --publish 127.0.0.1:4000:4000 \
            --env NODE_ENV=development \
            --env BRIDGE_DEALPILOT_CREDENTIAL_VAULT=encrypted-file \
            --env BRIDGE_CREDENTIAL_VAULT_KEY_ID=ci-key \
            --env BRIDGE_CREDENTIAL_VAULT_KEY="$vault_key" \
            bridge-api:ci
          trap 'docker logs bridge-api-ci || true; docker rm --force bridge-api-ci || true' EXIT
          test "$(docker inspect --format '{{.Config.User}}' bridge-api-ci)" = "10001:10001"
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4000/health >/dev/null; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              echo "API container did not become live"
              exit 1
            fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:4000/health/ready \
            | grep -q '"ready":true'

  desktop:
    name: desktop shell (cargo check ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      # Report every OS independently — a Windows-only regression must not be
      # masked by (or cancel) the macOS/Linux legs. XP-1's whole point is
      # "compiles on all three desktop OSes", so we need all three signals.
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: platform/apps/desktop/src-tauri
      # Tauri v2's Linux backend (webkit2gtk-4.1 + soup3) is probed by the
      # crates' build scripts via pkg-config, so even `cargo check` needs the
      # -dev headers present. macOS/Windows use system frameworks / WebView2
      # (fetched by the build script), so they need no extra system packages.
      - name: Install Linux system deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev \
            librsvg2-dev
      # `generate_context!` embeds the frontendDist assets at compile time, so
      # the dir (../../web/dist) must exist for `cargo check` to succeed. XP-1
      # only unblocks COMPILATION, so a one-line stub is enough here — we don't
      # build the real web app on three OSes just to type-check Rust.
      - name: Provide stub frontend dist for generate_context!
        shell: bash
        run: |
          mkdir -p platform/apps/web/dist
          echo '<!doctype html><meta charset="utf-8"><title>Bridge (cargo-check stub)</title>' \
            > platform/apps/web/dist/index.html
      # DONE-WHEN: this is green on macOS + Linux + Windows. Apple-only crates
      # (objc2*) and the macos-private-api feature are gated to macOS in
      # Cargo.toml, so off-macOS the capture providers compile to empty/
      # unsupported arms (sensor_list returns []) instead of failing to build.
      - name: cargo check (compile the shell for this OS)
        run: cargo check --locked --manifest-path platform/apps/desktop/src-tauri/Cargo.toml
      # The capture-core ring buffer / observation queue are pure logic with no
      # OS deps, so their unit tests run anywhere — exercise them on Linux (the
      # cheapest leg, no Apple crates to compile) so they actually run in CI
      # instead of the old `echo` no-op.
      - name: cargo test (pure-logic capture-core tests)
        if: runner.os == 'Linux'
        run: cargo test --locked --manifest-path platform/apps/desktop/src-tauri/Cargo.toml

  desktop-bundle:
    name: desktop installers (tauri build ${{ matrix.os }})
    # XP-2: build only installers whose managed API transport is functional. Windows
    # remains compile-checked above, but packaging is intentionally gated until Node can
    # inherit the parent-reserved loopback listener without a rebind race.
    # Installer builds
    # are heavy (full release compile + web build), so this runs only on release tags
    # (v*) and manual dispatch — NOT on every PR (the `desktop` cargo-check job above
    # is the per-PR compile signal). Code-signing + notarization activate
    # automatically when the platform signing secrets are configured; without them the
    # build still succeeds and emits UNSIGNED installers. That signed/notarized half of
    # the DONE-WHEN unblocks the moment the certs land as repo secrets — no YAML change.
    # TASK-077: on an actual tag push (not manual dispatch — that has no
    # release to attach to) the macOS leg also publishes the dmg + the
    # updater's signed .app.tar.gz + latest.json to a GitHub Release, which
    # IS the auto-update channel `tauri.conf.json`'s `plugins.updater`
    # points at. Requires TAURI_SIGNING_PRIVATE_KEY[_PASSWORD] to be a real
    # secret — without it Tauri skips updater-artifact generation and the
    # publish step has nothing matching `fail_on_unmatched_files: false`
    # tolerates that instead of failing the whole release.
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.os }}
    # Only the release-publish step (macOS, tag push) needs this; the default
    # token is read-only otherwise and this job never touches anything else.
    permissions:
      contents: write
    strategy:
      # Independent per-OS signals.
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            bundles: app,dmg
          - os: ubuntu-latest
            bundles: deb,appimage
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.3
      - uses: actions/setup-node@v4
        with:
          node-version-file: platform/.nvmrc
          cache: pnpm
          cache-dependency-path: platform/pnpm-lock.yaml
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: platform/apps/desktop/src-tauri
      # Same Tauri v2 Linux backend headers the cargo-check job installs.
      - name: Install Linux system deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev \
            librsvg2-dev
      - name: Install workspace deps
        working-directory: platform
        run: pnpm install --frozen-lockfile
      - name: Test desktop bundle policy
        working-directory: platform/apps/desktop
        run: pnpm test:bundle
      - name: Import macOS signing certificate before runtime preparation
        if: runner.os == 'macOS'
        working-directory: platform/apps/desktop
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: node scripts/import-macos-certificate.mjs
      - name: Prepare portable API and target Node runtime
        working-directory: platform/apps/desktop
        run: pnpm prepare:bundle
      - name: Verify desktop bundle inputs
        working-directory: platform/apps/desktop
        run: pnpm verify:bundle-inputs
      - name: Build + bundle installers
        working-directory: platform/apps/desktop
        env:
          # beforeBuildCommand verifies the already-prepared inputs instead of
          # rebuilding the portable API a second time.
          BRIDGE_DESKTOP_BUNDLE_PREPARED: "1"
          # Tauri updater artifact signature (all platforms).
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # macOS Developer ID code-signing + notarization.
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: pnpm exec tauri build --bundles ${{ matrix.bundles }}
      - name: Verify macOS nested runtime signatures
        if: runner.os == 'macOS'
        working-directory: platform/apps/desktop
        run: pnpm verify:macos-bundle
      - name: Remove temporary macOS signing keychain
        if: always() && runner.os == 'macOS'
        run: |
          if [ -n "${BRIDGE_CODESIGN_KEYCHAIN:-}" ]; then
            security delete-keychain "$BRIDGE_CODESIGN_KEYCHAIN"
          fi
      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: bridge-installers-${{ matrix.os }}
          path: |
            platform/apps/desktop/src-tauri/target/release/bundle/**/*.dmg
            platform/apps/desktop/src-tauri/target/release/bundle/**/*.app.tar.gz
            platform/apps/desktop/src-tauri/target/release/bundle/**/*.app.tar.gz.sig
            platform/apps/desktop/src-tauri/target/release/bundle/**/*.AppImage
            platform/apps/desktop/src-tauri/target/release/bundle/**/*.deb
            platform/apps/desktop/src-tauri/target/release/bundle/latest.json
          if-no-files-found: warn
      # TASK-077 — the Mac auto-updater's endpoint IS a GitHub Release: the
      # plugin polls `releases/latest/download/latest.json`
      # (tauri.conf.json's `plugins.updater.endpoints`), so a tag build must
      # publish one, not just upload a CI artifact nobody's app can reach.
      # macOS only (matches the task scope — "an installer for mac"); Linux's
      # own `latest.json` entry is a separate, unrequested follow-up, so its
      # leg keeps uploading via actions/upload-artifact only, same as before.
      # `latest.json` is produced ONLY when `createUpdaterArtifacts` is set
      # AND TAURI_SIGNING_PRIVATE_KEY was present at build time — without
      # real signing secrets configured, this step has nothing to publish
      # and is skipped rather than publishing an unsigned, non-functional
      # update channel.
      - name: Publish macOS installer + updater manifest to the GitHub Release
        if: runner.os == 'macOS' && startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          fail_on_unmatched_files: false
          files: |
            platform/apps/desktop/src-tauri/target/release/bundle/dmg/*.dmg
            platform/apps/desktop/src-tauri/target/release/bundle/macos/*.app.tar.gz
            platform/apps/desktop/src-tauri/target/release/bundle/macos/*.app.tar.gz.sig
            platform/apps/desktop/src-tauri/target/release/bundle/latest.json
