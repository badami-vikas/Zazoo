name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  platform:
    name: platform (typecheck + test + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platform
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.3
      - uses: actions/setup-node@v4
        with:
          node-version-file: platform/.nvmrc
          cache: pnpm
          cache-dependency-path: platform/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:vocabulary
      # --force: never trust turbo's remote/local cache in CI — a green run must mean THIS
      # checkout was tested, not a replayed log from an unrelated branch/worktree
      # (see known-issues.md 2026-07-03, "turbo cache replays across worktrees").
      - run: pnpm turbo run typecheck test build --force

  security-audit:
    name: security audit (no HIGH+ vulnerable deps)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platform
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.3
      - uses: actions/setup-node@v4
        with:
          node-version-file: platform/.nvmrc
          cache: pnpm
          cache-dependency-path: platform/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      # SEC-3 gate: fail the build on any HIGH/CRITICAL advisory in production deps.
      # --prod ignores devDependencies (build-only tooling); raise the bar to `moderate`
      # once the current moderate advisories are triaged. Runs as its own job so a
      # vulnerable dependency is an unambiguous, standalone red check.
      - run: pnpm audit --prod --audit-level=high

  api-container:
    name: API container (build + non-root smoke)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build production image
        run: docker build --file platform/Dockerfile --tag bridge-api:ci platform
      - name: Production configuration fails closed
        run: |
          if docker run --rm bridge-api:ci > /tmp/bridge-production-boot.log 2>&1; then
            echo "Container unexpectedly started without production configuration"
            exit 1
          fi
          grep -q "incomplete or unsafe production configuration" /tmp/bridge-production-boot.log
      - name: Probe liveness and readiness as non-root
        run: |
          vault_key="$(printf '0123456789abcdef0123456789abcdef' | base64 -w0)"
          docker run --detach --name bridge-api-ci \
            --publish 127.0.0.1:4000:4000 \
            --env NODE_ENV=development \
            --env BRIDGE_DEALPILOT_CREDENTIAL_VAULT=encrypted-file \
            --env BRIDGE_CREDENTIAL_VAULT_KEY_ID=ci-key \
            --env BRIDGE_CREDENTIAL_VAULT_KEY="$vault_key" \
            bridge-api:ci
          trap 'docker logs bridge-api-ci || true; docker rm --force bridge-api-ci || true' EXIT
          test "$(docker inspect --format '{{.Config.User}}' bridge-api-ci)" = "10001:10001"
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4000/health >/dev/null; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              echo "API container did not become live"
              exit 1
            fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:4000/health/ready \
            | grep -q '"ready":true'

  desktop:
    name: desktop shell (cargo check ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      # Report every OS independently — a Windows-only regression must not be
      # masked by (or cancel) the macOS/Linux legs. XP-1's whole point is
      # "compiles on all three desktop OSes", so we need all three signals.
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: platform/apps/desktop/src-tauri
      # Tauri v2's Linux backend (webkit2gtk-4.1 + soup3) is probed by the
      # crates' build scripts via pkg-config, so even `cargo check` needs the
      # -dev headers present. macOS/Windows use system frameworks / WebView2
      # (fetched by the build script), so they need no extra system packages.
      - name: Install Linux system deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev \
            librsvg2-dev
      # `generate_context!` embeds the frontendDist assets at compile time, so
      # the dir (../../web/dist) must exist for `cargo check` to succeed. XP-1
      # only unblocks COMPILATION, so a one-line stub is enough here — we don't
      # build the real web app on three OSes just to type-check Rust.
      - name: Provide stub frontend dist for generate_context!
        shell: bash
        run: |
          mkdir -p platform/apps/web/dist
          echo '<!doctype html><meta charset="utf-8"><title>Bridge (cargo-check stub)</title>' \
            > platform/apps/web/dist/index.html
      # DONE-WHEN: this is green on macOS + Linux + Windows. Apple-only crates
      # (objc2*) and the macos-private-api feature are gated to macOS in
      # Cargo.toml, so off-macOS the capture providers compile to empty/
      # unsupported arms (sensor_list returns []) instead of failing to build.
      - name: cargo check (compile the shell for this OS)
        run: cargo check --locked --manifest-path platform/apps/desktop/src-tauri/Cargo.toml
      # The capture-core ring buffer / observation queue are pure logic with no
      # OS deps, so their unit tests run anywhere — exercise them on Linux (the
      # cheapest leg, no Apple crates to compile) so they actually run in CI
      # instead of the old `echo` no-op.
      - name: cargo test (pure-logic capture-core tests)
        if: runner.os == 'Linux'
        run: cargo test --locked --manifest-path platform/apps/desktop/src-tauri/Cargo.toml

  desktop-bundle:
    name: desktop installers (tauri build ${{ matrix.os }})
    # XP-2: build the native installers on all three desktop OSes. Installer builds
    # are heavy (full release compile + web build), so this runs only on release tags
    # (v*) and manual dispatch — NOT on every PR (the `desktop` cargo-check job above
    # is the per-PR compile signal). GitHub-hosted runners ARE macOS/Windows/Linux, so
    # this produces real installers on each. Code-signing + notarization activate
    # automatically when the platform signing secrets are configured; without them the
    # build still succeeds and emits UNSIGNED installers. That signed/notarized half of
    # the DONE-WHEN unblocks the moment the certs land as repo secrets — no YAML change.
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.os }}
    strategy:
      # Independent per-OS signals — a Windows packaging break must not mask macOS/Linux.
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            bundles: app,dmg
          - os: ubuntu-latest
            bundles: deb,appimage
          - os: windows-latest
            bundles: msi,nsis
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.3
      - uses: actions/setup-node@v4
        with:
          node-version-file: platform/.nvmrc
          cache: pnpm
          cache-dependency-path: platform/pnpm-lock.yaml
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: platform/apps/desktop/src-tauri
      # Same Tauri v2 Linux backend headers the cargo-check job installs.
      - name: Install Linux system deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev \
            librsvg2-dev
      - name: Install workspace deps
        working-directory: platform
        run: pnpm install --frozen-lockfile
      # Tauri's frontendDist is ../../web/dist and beforeBuildCommand is empty, so the
      # real web client must be built before bundling (not the cargo-check stub).
      - name: Build web frontend
        working-directory: platform
        run: pnpm --filter @bridge/web build
      - name: Build + bundle installers
        working-directory: platform/apps/desktop
        env:
          # Tauri updater artifact signature (all platforms).
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # macOS Developer ID code-signing + notarization.
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # Windows Authenticode signing (Tauri v2 signtool inputs).
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: pnpm exec tauri build --bundles ${{ matrix.bundles }}
      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: bridge-installers-${{ matrix.os }}
          path: |
            platform/apps/desktop/src-tauri/target/release/bundle/**/*.dmg
            platform/apps/desktop/src-tauri/target/release/bundle/**/*.app.tar.gz
            platform/apps/desktop/src-tauri/target/release/bundle/**/*.msi
            platform/apps/desktop/src-tauri/target/release/bundle/**/*-setup.exe
            platform/apps/desktop/src-tauri/target/release/bundle/**/*.AppImage
            platform/apps/desktop/src-tauri/target/release/bundle/**/*.deb
          if-no-files-found: warn

  prototype:
    name: prototype (typecheck + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Design Bridge AI Interface (Copy)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: Design Bridge AI Interface (Copy)/.nvmrc
          cache: npm
          cache-dependency-path: Design Bridge AI Interface (Copy)/package-lock.json
      - run: npm install --legacy-peer-deps
      - run: npx tsc --noEmit
      - run: npm run build

  pii-guard:
    name: PII guard (no real export committed)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          for f in \
            "Design Bridge AI Interface (Copy)/data/Connections.csv" \
            "Design Bridge AI Interface (Copy)/data/Invitations.csv" \
            "Design Bridge AI Interface (Copy)/data/seed_canonical.sql" \
            "Design Bridge AI Interface (Copy)/src/app/data/dbSignals.ts" \
            "Design Bridge AI Interface (Copy)/src/app/data/reconStaging.ts"; do
            if [ -f "$f" ]; then
              echo "BLOCKED: $f must never be committed (PII-derived artifact)."
              exit 1
            fi
          done
          NET="Design Bridge AI Interface (Copy)/src/app/data/network.ts"
          total=$(grep -cE "id: '[^']+'" "$NET" || true)
          dummy=$(grep -cE "id: 'dummy_" "$NET" || true)
          if [ "$total" -gt 0 ] && [ "$dummy" -lt "$total" ]; then
            echo "BLOCKED: $NET has non-dummy_ rows — looks like a real export was committed."
            exit 1
          fi
