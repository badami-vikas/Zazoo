# Helpdesk capability package manifest (docs/raw/capability-package-format.md, ADR-018/ADR-021).
# NOTE: named bridge.package.yaml (not package.yaml as ADR-018 spells) because pnpm treats
# package.yaml as a project-manifest format and it shadows package.json in a workspace dir.
# In-Bridge governed MVP: the Help Request entity flow — a request routed over the workspace
# graph (src/routing.ts routeHelpRequest) and an answer staged as a governed draft
# (draftHelpOffer -> pipeline.propose in apps/api, draft-then-approve). Kernel-safe vocab:
# Help Request / Help Route / Help Offer, never Ticket/Lead/Case at this seam.
# Parsed by @bridge/core's parsePackageManifest via the packages.register tRPC endpoint.
package:
  name: helpdesk
  version: 0.0.1
  kind: workspace_definition
  summary: >-
    Routes help requests to the workspace members best placed to answer, and
    stages every answer as a governed draft for human approval.
  description: >-
    Install when a workspace fields help requests from its community. Each Help
    Request is routed over the workspace graph by deterministic topic overlap
    (routeHelpRequest — honest empty result when nothing matches, no fabricated
    routes), and every Help Offer is drafted through the governed pipeline
    (draft-then-approve; the capability never sends or commits an answer itself).
    Shared team surface: audience=team raises even advisory-band capabilities to
    at least a user-preference check (informational x shared is never auto).
  lineage_manifest_id: null
  dependencies: []
  capabilities:
    # Request routing over the graph — reads help_request, writes a help_route
    # recommendation. Transformational: an ordinary workspace-data write.
    - id: helpdesk.capability-routing
      name: helpdesk.capability-routing
      version: 0.0.1
      capability_type: skill
      origin: built_in
      audience: team
      permissions:
        - { resource_type: help_request, action: read, data_scope: all, egress: false }
        - { resource_type: help_route, action: write, data_scope: all, egress: false }
      connectors: []
    # Offer drafting — draft-then-approve output only. Advisory band by shape
    # (a recommendation-shaped write, never durable state, never egress).
    - id: helpdesk.offer-drafting
      name: helpdesk.offer-drafting
      version: 0.0.1
      capability_type: skill
      origin: built_in
      audience: team
      permissions:
        - { resource_type: recommendation, action: write, data_scope: all, egress: false }
      connectors: []
  context_providers: []
  workspace_vocab:
    aligns_to_bridge_theme: true
    domain_terms:
      help_request: "a Signal-shaped ask from a person in the workspace graph"
      help_offer: "a governed draft answer — proposed, never auto-sent"
