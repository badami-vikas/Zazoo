<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bridge Companion</title>
    <!-- Transparent OS-level companion window (Tauri "overlay") — the page
         itself must never paint a background or the window transparency is
         moot. globals.css sets body colors; this wins by specificity+order. -->
    <style>
      html,
      body {
        background: transparent !important;
        margin: 0;
        overflow: hidden;
      }
    </style>
  </head>
  <body>
    <div id="overlay-root"></div>
    <script type="module" src="/src/overlay-main.tsx"></script>
  </body>
</html>
