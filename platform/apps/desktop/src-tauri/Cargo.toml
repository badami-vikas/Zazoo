[package]
name = "bridge-desktop"
version = "0.1.0"
description = "Bridge desktop shell (Tauri v2) — hosts apps/web, will host the Rust capture core (Sensor SPI desktop subset)"
authors = ["Bridge"]
edition = "2021"

[lib]
name = "bridge_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = [
    "std",
    "NSString",
    "NSNotification",
    "NSDictionary",
    "NSArray",
    "NSObject",
    "NSValue",
    "NSGeometry",
] }
objc2-app-kit = { version = "0.3", default-features = false, features = [
    "std",
    "NSWorkspace",
    "NSRunningApplication",
    "NSPasteboard",
    "NSPasteboardItem",
    "NSApplication",
] }
