[package]
name = "bridge-desktop"
version = "0.1.0"
description = "Bridge desktop shell (Tauri v2) — hosts apps/web, will host the Rust capture core (Sensor SPI desktop subset)"
authors = ["Bridge"]
edition = "2021"

[lib]
name = "bridge_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
# Verifies the pinned wa-js bundle hash at build time (see build.rs).
sha2 = "0.10"

[dependencies]
# `macos-private-api` is required by tauri.conf.json's `macOSPrivateApi: true`
# (transparent overlay webview backgrounds, R-002) and tauri-build asserts at
# compile time that the two match. It stays declared UNCONDITIONALLY because
# the feature is inert on Linux/Windows — Tauri guards every private-API call
# with `#[cfg(target_os = "macos")]`, so it pulls no Apple-only native crate
# and raises no error off-macOS. (Splitting it into a macОS-only target dep
# instead makes tauri-build fail on macOS: the feature isn't seen as enabled.)
# `webview-data-url` supports the static, tokenless bootstrap and terminal
# unavailable pages shown before/after the privileged Local Plane webview.
tauri = { version = "2", features = ["macos-private-api", "webview-data-url"] }
# Global push-to-talk summon for the companion (TASK-027 clicky-parity). The
# plugin is registered Rust-side only — no webview capability entries — so a
# compromised webview cannot re-bind or intercept the shortcut.
tauri-plugin-global-shortcut = "2"
# Mac installer auto-update (TASK-077). Registered Rust-side only, same
# reasoning as global-shortcut above: the update check/download/install
# sequence is shell-level infra, not something the web content should be
# able to trigger, so it carries no webview capability entry.
tauri-plugin-updater = "2"
# Only used for the post-install relaunch (`app.restart()`) the updater
# needs to apply a downloaded update.
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
getrandom = "0.3"
sha2 = "0.10"
# companion.rs outbound HTTP (Groq vision/STT + managed local llama endpoint).
# ureq is blocking-only + rustls — no tokio surface added to the shell.
ureq = { version = "2", features = ["json"] }
base64 = "0.22"
# Honest screenshot dimensions: decode the real JPEG header instead of
# assuming the display's physical size matches the captured image.
imagesize = "0.13"
# Two-stage grid locator (companion.rs): crop a screenshot region and
# re-encode it so a weak-grounding vision model can be asked to narrow down
# a target inside a zoomed view. JPEG only — no other codecs pulled in.
image = { version = "0.25", default-features = false, features = ["jpeg"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Apple-only capture crates, gated to macOS so the shell still `cargo check`s on
# Linux + Windows (XP-1). These are the actual cross-OS-compile blocker: the
# only code that touches them is itself `#[cfg(target_os = "macos")]`
# (providers/apps.rs NSWorkspace frontmost-app polling, providers/clipboard.rs
# NSPasteboard polling), so off macOS nothing references them and the non-macOS
# command arms return empty / unsupported instead (see sensor_bridge.rs).
[target.'cfg(target_os = "macos")'.dependencies]
# tauri-nspanel 2.1.0, pinned to the inspected v2.1 branch commit.
# Upstream: https://github.com/ahkohd/tauri-nspanel
# License: MIT OR Apache-2.0 (LICENSE_MIT + LICENSE_APACHE-2.0 at this rev).
tauri-nspanel = { git = "https://github.com/ahkohd/tauri-nspanel", rev = "a3122e894383aa068ec5365a42994e3ac94ba1b6" }
# `exception` gives us `objc2::exception::catch`, the only way to stop an ObjC
# exception raised during native window teardown from reaching tao's run-loop
# observer, where Rust can only abort (`__rust_foreign_exception`).
objc2 = { version = "0.6", features = ["exception"] }
objc2-foundation = { version = "0.3", default-features = false, features = [
    "std",
    "NSString",
    "NSNotification",
    "NSDictionary",
    "NSArray",
    "NSObject",
    "NSValue",
    "NSGeometry",
    # `NSProcessInfo` is the runtime macOS version check guarding the WhatsApp
    # session's `data_store_identifier` (WKWebView custom data stores are
    # macOS >= 14 only). See whatsapp_webview::supports_data_store_identifier.
    "NSProcessInfo",
    # `open_external_url`: NSURL for NSWorkspace.openURL — the shell opens the
    # Claude sign-in page in-process (the `open` CLI from a child timed out,
    # LaunchServices -1712, observed live 2026-09-03).
    "NSURL",
] }
objc2-app-kit = { version = "0.3", default-features = false, features = [
    "std",
    "NSWorkspace",
    "NSRunningApplication",
    "NSPasteboard",
    "NSPasteboardItem",
    "NSApplication",
    # Zazoo's notch home (Z1): NSScreen carries `safeAreaInsets` and the
    # `auxiliaryTop{Left,Right}Area` pair the notch rect is derived from;
    # NSEvent supplies the permission-free global cursor position the
    # hover watcher polls (a CGEventTap would need Input Monitoring).
    "NSScreen",
    "NSEvent",
] }

# Debug-build crypto at release speed. The model supervisor re-verifies the
# pinned ~2.5GB model artifact's SHA-256 on EVERY llama-server launch — a
# deliberate, uncached fail-closed supply-chain check — and sha2's software
# fallback in an unoptimized build hashes so slowly that a dev app sat in
# `launch → sha256_file` for over an hour after a rebuild (observed live
# 2026-07-31 via `sample`), leaving the Local Plane model, and everything
# gated on it (webResearch content guard, local-first planner, local ask),
# unavailable the whole time. Release profiles are unaffected.
[profile.dev.package.sha2]
opt-level = 3

[profile.dev.package.digest]
opt-level = 3

[profile.dev.package.block-buffer]
opt-level = 3

[profile.dev.package.cpufeatures]
opt-level = 3
