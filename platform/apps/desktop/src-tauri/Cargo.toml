[package]
name = "bridge-desktop"
version = "0.1.0"
description = "Bridge desktop shell (Tauri v2) — hosts apps/web, will host the Rust capture core (Sensor SPI desktop subset)"
authors = ["Bridge"]
edition = "2021"

[lib]
name = "bridge_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `macos-private-api` is required by tauri.conf.json's `macOSPrivateApi: true`
# (transparent overlay webview backgrounds, R-002) and tauri-build asserts at
# compile time that the two match. It stays declared UNCONDITIONALLY because
# the feature is inert on Linux/Windows — Tauri guards every private-API call
# with `#[cfg(target_os = "macos")]`, so it pulls no Apple-only native crate
# and raises no error off-macOS. (Splitting it into a macОS-only target dep
# instead makes tauri-build fail on macOS: the feature isn't seen as enabled.)
tauri = { version = "2", features = ["macos-private-api"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Apple-only capture crates, gated to macOS so the shell still `cargo check`s on
# Linux + Windows (XP-1). These are the actual cross-OS-compile blocker: the
# only code that touches them is itself `#[cfg(target_os = "macos")]`
# (providers/apps.rs NSWorkspace frontmost-app polling, providers/clipboard.rs
# NSPasteboard polling), so off macOS nothing references them and the non-macOS
# command arms return empty / unsupported instead (see sensor_bridge.rs).
[target.'cfg(target_os = "macos")'.dependencies]
# tauri-nspanel 2.1.0, pinned to the inspected v2.1 branch commit.
# Upstream: https://github.com/ahkohd/tauri-nspanel
# License: MIT OR Apache-2.0 (LICENSE_MIT + LICENSE_APACHE-2.0 at this rev).
tauri-nspanel = { git = "https://github.com/ahkohd/tauri-nspanel", rev = "a3122e894383aa068ec5365a42994e3ac94ba1b6" }
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = [
    "std",
    "NSString",
    "NSNotification",
    "NSDictionary",
    "NSArray",
    "NSObject",
    "NSValue",
    "NSGeometry",
] }
objc2-app-kit = { version = "0.3", default-features = false, features = [
    "std",
    "NSWorkspace",
    "NSRunningApplication",
    "NSPasteboard",
    "NSPasteboardItem",
    "NSApplication",
] }
