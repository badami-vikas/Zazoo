services:
  - type: web
    name: bridge-pilot-api
    runtime: docker
    repo: https://github.com/badami-vikas/relationship-os
    plan: free
    region: virginia
    branch: main
    # Auto-deploys on push to main (ADR-195). The `supabase-migrate` CI job
    # applies pending migrations first and finishes in well under a minute;
    # this Docker build takes several, so migrations land first in practice.
    # Not a transactional guarantee — Render's own git trigger fires on push
    # regardless of GitHub Actions' outcome, so a red CI run still deploys.
    autoDeploy: true
    dockerfilePath: ./platform/Dockerfile
    dockerContext: ./platform
    healthCheckPath: /health
    envVars:
      - key: API_HOST
        value: 0.0.0.0
      - key: BRIDGE_LOCAL_DIR
        value: /tmp/bridge-public-only/local
      - key: BRIDGE_FILES_ROOT
        value: /tmp/bridge-public-only/files
      - key: BRIDGE_LOCAL_RESIDENCY
        value: public-cloud
      - key: BRIDGE_DEALPILOT_CREDENTIAL_VAULT
        value: disabled
      - key: BRIDGE_RENDER_WEB_HOST
        value: bridge-pilot-web.onrender.com
      # Rate limits were governed in production by the hardcoded fallbacks in
      # server.ts rateLimitConfig() because none of these were ever set. Pinned
      # here at the same values so the limits are explicit and reviewable rather
      # than implicit — change them here, not in code.
      - key: API_RATE_LIMIT_MAX
        value: "300"
      - key: API_RATE_LIMIT_SENSITIVE_MAX
        value: "10"
      - key: API_RATE_LIMIT_WINDOW_MS
        value: "60000"
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: BRIDGE_PILOT_USER_ID
        sync: false
      - key: BRIDGE_PILOT_USER_EMAIL
        sync: false
      # Cloud-Plane chat ModelProvider for the hosted web app. Without at least
      # one of these the API registers NO cloud provider and every Chat Panel
      # turn fails closed with "No authorized cloud model provider is configured"
      # (no fake fallback, by design). Set ONE in the Render dashboard (secret,
      # never committed). GROQ_API_KEY (groq.com, free tier) is the recommended
      # low/no-cost option; ANTHROPIC_API_KEY is higher quality but metered.
      # Desktop chat uses the on-device llama runtime and needs neither.
      - key: GROQ_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false

  - type: web
    name: bridge-pilot-web
    runtime: static
    repo: https://github.com/badami-vikas/relationship-os
    branch: main
    autoDeploy: true
    buildCommand: >-
      test -n "$BRIDGE_RENDER_API_HOST" &&
      corepack enable &&
      corepack prepare pnpm@10.33.3 --activate &&
      cd platform &&
      pnpm install --frozen-lockfile &&
      VITE_API_URL="https://${BRIDGE_RENDER_API_HOST}" pnpm turbo run build --filter=...@bridge/web
    staticPublishPath: platform/apps/web/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: X-Frame-Options
        value: DENY
    envVars:
      - key: BRIDGE_RENDER_API_HOST
        value: bridge-pilot-api.onrender.com
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_PUBLISHABLE_KEY
        sync: false

previews:
  generation: "off"
