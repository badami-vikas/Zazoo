<!doctype html><html><head><meta charset="utf-8"><title>Carrier B — New Quote</title>
<style>body{font:15px system-ui;max-width:560px;margin:40px auto}label{display:block;margin:10px 0}input,select{width:100%;padding:6px}fieldset{margin:10px 0}</style></head>
<body><h2>Carrier B · Quote application</h2><p>Empty form with different labels. Open the Avatar and say <b>recall and paste</b>.</p>
<form>
<label>Given name <input id="a"></label>
<label>Surname <input id="b"></label>
<label>E-mail <input id="c" type="email"></label>
<label>Mobile number <input id="d"></label>
<label>Birth date <input id="e" type="date"></label>
<label>Address line 1 <input id="f"></label>
<label>City <input id="g"></label>
<label>Province <select id="h"><option value="">—</option><option value="CA">California</option><option value="NV">Nevada</option></select></label>
<label>Postal code <input id="i"></label>
<fieldset><legend>Sex</legend><label><input type="radio" name="s" value="male"> Male</label><label><input type="radio" name="s" value="female"> Female</label></fieldset>
<label><input type="checkbox" id="j"> Marital status: married</label>
<label>Year <input id="k"></label>
<label>Make <input id="l"></label>
<label>Model <input id="m"></label>
<label>Vehicle Identification Number <input id="n"></label>
<label>Annual mileage <input id="o" placeholder="not on the source page"></label>
<p><button type="button">Submit (does nothing)</button></p>
</form></body></html>
