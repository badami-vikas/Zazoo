<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Avatar</title>
<style>
  :root { --bg:#0f1115; --panel:#181b22; --ink:#e8e9ee; --dim:#8a8f9c; --accent:#6c5ce7; --me:#26314a; }
  * { box-sizing:border-box }
  body { margin:0; background:var(--bg); color:var(--ink); font:14px/1.45 -apple-system,system-ui,sans-serif; display:flex; flex-direction:column; height:100vh }
  header { display:flex; align-items:center; gap:12px; padding:14px 16px; border-bottom:1px solid #262a33 }
  header b { font-weight:600 } header small { color:var(--dim); display:block }
  #avatar { width:44px; height:44px }
  #avatar .eye { transform-origin:center; animation:blink 5s infinite }
  #avatar .eye.r { animation-delay:.1s }
  #avatar.busy .eye { animation:blink .35s 3 }
  @keyframes blink { 0%,92%,100% { transform:scaleY(1) } 96% { transform:scaleY(.08) } }
  #log { flex:1; overflow:auto; padding:12px 16px; display:flex; flex-direction:column; gap:10px }
  .msg { max-width:92%; padding:8px 12px; border-radius:12px; background:var(--panel); white-space:pre-wrap; word-break:break-word }
  .msg.me { align-self:flex-end; background:var(--me) }
  .msg table { border-collapse:collapse; margin-top:6px; font-size:13px }
  .msg td { padding:2px 8px 2px 0; vertical-align:top } .msg td:first-child { color:var(--dim); white-space:nowrap }
  form { display:flex; gap:8px; padding:12px 16px; border-top:1px solid #262a33 }
  input { flex:1; background:var(--panel); border:1px solid #2c3140; color:var(--ink); border-radius:10px; padding:10px 12px; font:inherit; outline:none }
  input:focus { border-color:var(--accent) }
  button { background:var(--accent); color:#fff; border:0; border-radius:10px; padding:0 14px; font:inherit; cursor:pointer }
</style>
</head>
<body>
<header>
  <svg id="avatar" viewBox="0 0 48 48" aria-hidden="true">
    <circle cx="24" cy="24" r="22" fill="#6c5ce7"/>
    <ellipse class="eye l" cx="17" cy="22" rx="3.2" ry="4.5" fill="#fff"/>
    <ellipse class="eye r" cx="31" cy="22" rx="3.2" ry="4.5" fill="#fff"/>
    <path d="M16 31q8 6 16 0" stroke="#fff" stroke-width="2.2" fill="none" stroke-linecap="round"/>
  </svg>
  <div><b>Avatar</b><small id="status">Nothing on the clipboard yet</small></div>
</header>
<div id="log"></div>
<form id="f"><input id="q" placeholder="copy the details · recall · paste them here" autocomplete="off" autofocus><button>Send</button></form>
<script src="match.js"></script>
<script src="sidepanel.js"></script>
</body>
</html>
