<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bridge AI — Recon</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 360px;
      min-height: 200px;
      background: #0f0f11;
      color: #e8e8ea;
      font-family: -apple-system, BlinkMacSystemFont, 'Inter', sans-serif;
      font-size: 13px;
    }

    header {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 12px 16px;
      border-bottom: 1px solid #1e1e24;
    }

    .logo {
      width: 20px;
      height: 20px;
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      border-radius: 5px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 10px;
      font-weight: 700;
      color: white;
      flex-shrink: 0;
    }

    header h1 {
      font-size: 13px;
      font-weight: 600;
      color: #e8e8ea;
    }

    header .badge {
      margin-left: auto;
      font-size: 10px;
      color: #6b6b7a;
      background: #1a1a22;
      padding: 2px 7px;
      border-radius: 10px;
    }

    #state-loading, #state-not-linkedin, #state-error, #state-profile, #state-saved {
      display: none;
      padding: 16px;
    }

    .muted { color: #6b6b7a; font-size: 12px; }

    .profile-name {
      font-size: 15px;
      font-weight: 600;
      color: #e8e8ea;
      margin-bottom: 2px;
    }
    .profile-headline {
      color: #a0a0b0;
      font-size: 12px;
      margin-bottom: 2px;
    }
    .profile-location {
      color: #6b6b7a;
      font-size: 11px;
    }

    .divider { border: none; border-top: 1px solid #1e1e24; margin: 12px 0; }

    .stat-row {
      display: flex;
      gap: 16px;
      margin: 10px 0;
    }
    .stat { text-align: center; }
    .stat-num { font-size: 18px; font-weight: 700; color: #8b5cf6; }
    .stat-label { font-size: 10px; color: #6b6b7a; text-transform: uppercase; letter-spacing: 0.5px; }

    .section-preview {
      background: #1a1a22;
      border-radius: 8px;
      padding: 10px 12px;
      margin-bottom: 8px;
      font-size: 12px;
    }
    .section-preview strong { display: block; color: #8b5cf6; font-size: 10px; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 4px; }
    .section-preview span { color: #c0c0d0; line-height: 1.5; }

    .btn {
      display: block;
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.15s;
    }
    .btn:hover { opacity: 0.85; }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; }

    .btn-primary {
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      color: white;
      margin-top: 12px;
    }

    .btn-secondary {
      background: #1a1a22;
      color: #a0a0b0;
      margin-top: 6px;
      font-size: 12px;
    }

    .saved-icon { font-size: 32px; margin-bottom: 8px; }
    .saved-msg { font-weight: 600; color: #22c55e; margin-bottom: 4px; }

    .error-msg { color: #f87171; font-size: 12px; line-height: 1.5; }

    .spinner {
      width: 20px; height: 20px;
      border: 2px solid #2a2a34;
      border-top-color: #8b5cf6;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      margin: 0 auto 8px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

<header>
  <div class="logo">B</div>
  <h1>Bridge AI · Recon</h1>
  <span class="badge">LinkedIn</span>
</header>

<!-- States -->
<div id="state-loading">
  <div class="spinner"></div>
  <p class="muted" style="text-align:center">Extracting profile…</p>
</div>

<div id="state-not-linkedin">
  <p class="muted">Navigate to a LinkedIn profile page<br>(linkedin.com/in/…) to extract data.</p>
</div>

<div id="state-error">
  <p class="error-msg" id="error-msg" style="white-space:pre-wrap"></p>
  <button class="btn btn-secondary" id="btn-retry" style="margin-top:10px">Try Again</button>
</div>

<div id="state-profile">
  <div class="profile-name" id="p-name"></div>
  <div class="profile-headline" id="p-headline"></div>
  <div class="profile-location" id="p-location"></div>

  <div class="stat-row">
    <div class="stat">
      <div class="stat-num" id="s-exp">0</div>
      <div class="stat-label">Roles</div>
    </div>
    <div class="stat">
      <div class="stat-num" id="s-edu">0</div>
      <div class="stat-label">Schools</div>
    </div>
    <div class="stat">
      <div class="stat-num" id="s-skills">0</div>
      <div class="stat-label">Skills</div>
    </div>
  </div>

  <hr class="divider" />

  <div class="section-preview" id="exp-preview" style="display:none">
    <strong>Latest Role</strong>
    <span id="exp-text"></span>
  </div>

  <div class="section-preview" id="about-preview" style="display:none">
    <strong>About</strong>
    <span id="about-text"></span>
  </div>

  <button class="btn btn-primary" id="btn-save">Save to Bridge Recon</button>
  <button class="btn btn-secondary" id="btn-copy">Copy JSON</button>
</div>

<div id="state-saved">
  <div class="saved-icon">✓</div>
  <p class="saved-msg" id="saved-msg">Saved to staging</p>
  <p class="muted" id="saved-sub"></p>
  <button class="btn btn-secondary" id="btn-view">View in Recon →</button>
</div>

<script src="popup.js"></script>
</body>
</html>
