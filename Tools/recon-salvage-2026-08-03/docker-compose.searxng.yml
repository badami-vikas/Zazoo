# SearXNG — the zero-cost, keyless search backend for Recon's Stage A discovery.
# Run:   docker compose -f docker-compose.searxng.yml up -d
# Test:  curl 'http://localhost:8888/search?q=test&format=json' | head
# Recon reads SEARXNG_URL (default http://localhost:8888).
services:
  searxng:
    image: searxng/searxng:latest
    container_name: recon-searxng
    ports:
      - "8888:8080"
    volumes:
      - ./searxng:/etc/searxng:rw
    environment:
      # Public base URL SearXNG advertises; localhost is fine for a private instance.
      - SEARXNG_BASE_URL=http://localhost:8888/
    restart: unless-stopped
